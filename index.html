<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Johnston Square Dashboard</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 18px;
}
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
}
section {
  background: white;
  border: 1px solid #dce2eb;
  border-radius: 7px;
  overflow: hidden;
}
iframe {
  border: 0;
  width: 100%;
  height: 650px;
  display: block;
}
</style>
</head>
<body>
<div class="grid">
<section><iframe src="01_total_population.html" title="Total population" loading="lazy"></iframe></section>
<section><iframe src="02_population_change.html" title="Population change" loading="lazy"></iframe></section>
<section><iframe src="03_black_share.html" title="Non-Hispanic Black share" loading="lazy"></iframe></section>
<section><iframe src="04_hispanic_share.html" title="Hispanic or Latino share" loading="lazy"></iframe></section>
<section><iframe src="05_household_income.html" title="Average household income" loading="lazy"></iframe></section>
<section><iframe src="06_poverty_rate.html" title="Poverty rate" loading="lazy"></iframe></section>
<section><iframe src="07_education.html" title="Educational attainment" loading="lazy"></iframe></section>
<section><iframe src="08_vacancy.html" title="Vacant housing units" loading="lazy"></iframe></section>
</div>
</body>
</html>
